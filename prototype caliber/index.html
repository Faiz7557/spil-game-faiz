      THESIS: A control room for reliability follow-through: every figure is a recorded value that opens its source, and nothing closes without evidence. Refuses the fake-live KPI wall and the failure-prediction dashboard.
      OWN-WORLD: Deep navy ground lit from the top left; smoked-glass panels with a hairline edge and lit top lip; one interactive blue; strict status vocabulary (red trip/overdue, amber alarm, green verified, cyan observed, violet = model output); hatching for anything simulated. IBM Plex Sans for UI, IBM Plex Mono for tags and source IDs, Archivo wide-heavy for landing display.
      STORY: The manager sees recorded loss by month and plant, the engineer picks the case the Problem Tank ranks first, reads condition against limits and a cited brief, and the planner closes actions only through evidence and a reviewer.
      FIRST VIEWPORT: Glass sidebar with the active-case switcher; workflow stepper with the next step; role tabs (View as) and Customize; five headline tiles with sparklines and rings; then the draggable widget grid.
      FORM: Brief-pinned direction (user references: IndustryOS analytics, an OEE ops board, Syntrix FactoryCore); revision 2 of seed b1ee7431.
