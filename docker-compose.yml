# Production stack: Postgres + one app container (Express + Socket.IO + built
# client) + Caddy for automatic HTTPS. Secrets have no defaults on purpose -
# copy .env.example to .env and fill them in, or compose refuses to start.
#
# Redis and ai-service are not used by the running server yet (see
# docs/DEPLOYMENT_ROADMAP.md, Fase 7), so they are not started here.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spil_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spil_game}
    # No published port: only reachable from the app on the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spil_admin} -d ${POSTGRES_DB:-spil_game}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5050
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-spil_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-spil_game}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    # Localhost only, for checking the app without Caddy. Public traffic goes through Caddy.
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:5050
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
